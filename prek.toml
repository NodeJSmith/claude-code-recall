# Configuration file for prek, a fast Rust-based Git hook manager.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# Install the hooks locally with `prek install` (mise.toml pins the prek version).
#
# Staging: fast, always-green hooks run at pre-commit; heavier checks run at pre-push.
# `default_install_hook_types` wires both stages automatically. CI runs both stages over
# every file (lint.yml), so a commit made without local hooks is still checked before merge.

default_install_hook_types = ["pre-commit", "pre-push"]

# ---------------------------------------------------------------------------
# Builtin hooks — Rust-native reimplementations, no venv or network fetch
# ---------------------------------------------------------------------------
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "check-case-conflict" },
    { id = "check-shebang-scripts-are-executable" },
]

# Hooks not yet reimplemented as builtins
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-builtin-literals" },
    { id = "debug-statements" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.46.3"
hooks = [
    { id = "typos", args = ["--force-exclude"], stages = ["pre-commit", "pre-push"] },
]

# The linter runs before the formatter so autofixes are reformatted in the same pass.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.17"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

# pass_filenames = false so pyright runs over its configured include (src/) via
# pyrightconfig.json rather than per file: explicit file args would override `include` and
# pull in tests/, which are intentionally unchecked. Whole-project is also correct for a
# type checker, since one file's change can break types in another.
[[repos]]
repo = "https://github.com/RobertCraigie/pyright-python"
rev = "v1.1.408"
hooks = [
    { id = "pyright", pass_filenames = false, stages = ["pre-push"] },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    # The upstream hook runs `gitleaks git --staged`, which scans only the index. At pre-push
    # or in CI's clean checkout nothing is staged, so it would pass vacuously — keep it
    # pre-commit only rather than show a green check that scanned nothing.
    { id = "gitleaks", stages = ["pre-commit"] },
    # Whole-tree scan for pre-push and CI (lint.yml runs `--stage pre-push`), so a commit made
    # without local hooks still gets scanned before merge. Reuses this hook repo's gitleaks
    # binary. Triaged false positives are allowlisted in .gitleaks.toml.
    { id = "gitleaks", alias = "gitleaks-tree", name = "Detect hardcoded secrets (tracked tree)", entry = "./tools/scan_tracked_secrets.sh", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]

# ---------------------------------------------------------------------------
# Local hooks — security and config validity
# ---------------------------------------------------------------------------
[[repos]]
repo = "local"

# --offline keeps zizmor from calling the GitHub API (it audits the static workflow files
# only); unsetting the tokens guarantees offline mode even when one is in the environment.
[[repos.hooks]]
id = "zizmor"
name = "zizmor (GitHub Actions security)"
language = "system"
entry = "env -u GH_TOKEN -u GITHUB_TOKEN uvx zizmor@1.25.2 --offline"
files = '^\.github/workflows/'
stages = ["pre-commit", "pre-push"]

# Validate codecov.yml against Codecov's API, only when it changes.
[[repos.hooks]]
id = "check-codecov-yml"
name = "Check codecov.yml validity"
language = "system"
entry = "curl --connect-timeout 10 --max-time 60 --fail --data-binary @./.github/codecov.yml https://codecov.io/validate"
files = '^\.github/codecov\.yml$'
pass_filenames = false
stages = ["pre-commit", "pre-push"]

# ---------------------------------------------------------------------------
# Local hooks — Python conventions
# ---------------------------------------------------------------------------

# Ban mypy-style `# type: ignore` comments; use `# pyright: ignore[reportXxx]`.
[[repos.hooks]]
id = "no-mypy-ignore"
name = 'Ban "type: ignore" comments (use pyright)'
language = "pygrep"
types = ["python"]
entry = "# type: ignore"

# Ban `from __future__ import annotations`: it stringizes annotations at runtime, breaking
# Pydantic models and get_type_hints(). Anchored to line start so prose merely mentioning
# it is not flagged.
[[repos.hooks]]
id = "no-future-annotations"
name = "Ban from __future__ import annotations (breaks runtime annotations)"
language = "pygrep"
types = ["python"]
entry = "^from __future__ import annotations"

# house-lint catches the habits AI coding assistants leave behind (lazy imports, AI-writing
# tells, leaked spec tokens, constant placement, exception names); rules and options live
# in pyproject.toml's [tool.house-lint]. `uv run` uses the version pinned in uv.lock.
[[repos.hooks]]
id = "house-lint"
name = "house-lint"
language = "system"
entry = "uv run house-lint check"
require_serial = true
types = ["python"]
files = '^(src|tests|scripts|tools)/.*\.py$'
stages = ["pre-commit", "pre-push"]
