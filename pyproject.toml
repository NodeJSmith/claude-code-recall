[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrecall"
version = "0.27.0"
description = "Conversation history and semantic search for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jessica Smith", email = "12jessicasmith34@gmail.com" }]
keywords = [
    "claude-code",
    "conversation-history",
    "search",
    "recall",
    "transcripts",
    "semantic-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Pinned to the versions in uv.lock: `uv tool install` without a lockfile
# ignores uv.lock and resolves fresh, so an unbounded range would pull newer
# ABI/runtime-breaking releases of these native wheels.
# fastembed is the embedding engine — it owns the ONNX runtime + tokenizers and
# the model download, so onnxruntime is left to fastembed's own constraint (an
# explicit pin here fights its resolver) and reproducibility comes from uv.lock.
# numpy is a direct dependency and uses Python-version markers. To re-sync after
# a bump: `uv lock` then mirror the resolved versions here.
dependencies = [
    "sqlite-vec==0.1.9",
    "fastembed==0.9.1",
    "numpy==2.5.4",
    "whenever==0.11.0",
    # Pin pydantic exactly so its native (Rust) pydantic-core dep resolves to a
    # known ABI — same rationale as the native wheels above.
    "pydantic==2.14.3",
    "cyclopts>=4.16",
    # Security floor: transitive via httpx → anyio
    "anyio>=4.14.2",
]

[project.urls]
Homepage = "https://github.com/NodeJSmith/claude-code-recall"
Issues = "https://github.com/NodeJSmith/claude-code-recall/issues"
Changelog = "https://github.com/NodeJSmith/claude-code-recall/blob/main/CHANGELOG.md"

[project.scripts]
# Unified CLI — single entry point. Subcommands replace the former skill-facing
# and helper cm-* tools.
ccrecall                 = "ccrecall.cli:main"
# Hook entry points (wired by the plugin's hooks/hooks.json). Kept as separate
# console scripts rather than `ccrecall hook ...` subcommands on purpose: hooks
# fire on every SessionStart/Stop, and routing through the full cyclopts app
# eager-imports the whole command surface (fastembed/numpy/onnxruntime, ~1800ms)
# vs ~440ms for a direct hook import. The no-lazy-imports rule rules out dodging
# that, so a direct entry point per hook stays the fast path.
ccrecall-setup           = "ccrecall.hooks.memory_setup:main"
ccrecall-sync            = "ccrecall.hooks.memory_sync:main"
ccrecall-context         = "ccrecall.hooks.memory_context:main"
ccrecall-clear-handoff   = "ccrecall.hooks.clear_handoff:main"
ccrecall-warm-model      = "ccrecall.hooks.warm_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=7.0.0",
    "coverage[toml]>=7.10.7",
    "house-lint>=0.5.0",
]

# house-lint checks the habits AI coding assistants leave behind. Its prek hook replaces
# this repo's former tools/check_lazy_imports.py, check_llm_cruft.py and check_spec_tokens.py.
#
# HSL001 AI-writing tells (divider comments, filler phrases) in comments/docstrings
# HSL002 imports inside function/method bodies ("lazy imports")
# HSL003 a top-level TYPE_CHECKING guard followed by a later top-level import
# HSL004 UPPER_CASE module constants defined after the first class/function
# HSL101 leaked spec-artifact tokens (AC#/FR#/NFR#/WP#/T##) in comments, docstrings, filenames
# HSL103 except-handler bindings that aren't named 'exc' or '*_exc'
[tool.house-lint]
include = ["src", "tests", "scripts", "tools"]
select = ["HSL001", "HSL002", "HSL003", "HSL004", "HSL101", "HSL103"]

[tool.house-lint.rules.HSL103]
# '*_exc' is a suffix wildcard: matches any name ending in "_exc" (retry_exc, inner_exc, ...).
allowed = ["exc", "*_exc"]

# HSL101's built-in families already cover comments, docstrings, and filenames, but
# case-sensitively. These add case-insensitive filename matching, since file names are
# conventionally lowercase. They stay filename-only: case-insensitive matching in prose
# would flag ordinary lowercase words like "tofu" or "frame".
[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["AC", "FR", "NFR", "WP"]
separator = "hash-optional"
min_digits = 1
suffix = "optional-lower-alpha"
scopes = ["filenames"]
case_sensitive = false

# min_digits = 2 keeps ordinary filenames like `t1_fixtures.py` out of scope.
[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["T"]
min_digits = 2
scopes = ["filenames"]
case_sensitive = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0"]

[tool.coverage.run]
branch = true          # measure branch coverage, not just lines
source = ["ccrecall"]
parallel = true        # suffix data files so per-Python-version CI shards combine cleanly
relative_files = true  # stable paths across CI runners
omit = ["*/__init__.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under = 80  # enable once a baseline is established; CI can override
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
